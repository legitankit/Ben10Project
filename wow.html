<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WOW JS Scroll Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Animate.css -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- WOW JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>

  <style>
    body {
      background: #0f172a;
    }
  </style>
</head>

<body class="text-white">

  <!-- Initialize WOW -->
  <script>
    new WOW().init();
  </script>

  <div class="text-center py-20">
    <h1 class="text-5xl font-bold text-green-400">
      Scroll Down 👇
    </h1>
  </div>

  <!-- Section 1 -->
  <div class="wow animate__animated animate__fadeInLeft 
              bg-blue-600 p-16 m-10 rounded-2xl text-center text-2xl"
       data-wow-duration="1.5s">
    Fade In Left 🌊
  </div>

  <!-- Section 2 -->
  <div class="wow animate__animated animate__fadeInRight 
              bg-purple-600 p-16 m-10 rounded-2xl text-center text-2xl"
       data-wow-delay="0.3s">
    Fade In Right 🎭
  </div>

  <!-- Section 3 -->
  <div class="wow animate__animated animate__zoomIn 
              bg-green-600 p-16 m-10 rounded-2xl text-center text-2xl"
       data-wow-duration="2s">
    Zoom In 🔍
  </div>

  <!-- Section 4 -->
  <div class="wow animate__animated animate__bounceInUp 
              bg-red-600 p-16 m-10 rounded-2xl text-center text-2xl"
       data-wow-delay="0.5s">
    Bounce In Up 🚀
  </div>

  <!-- Section 5 -->
  <div class="wow animate__animated animate__flipInX 
              bg-yellow-500 text-black p-16 m-10 rounded-2xl text-center text-2xl"
       data-wow-duration="1.5s">
    Flip In X 🔥
  </div>

  <div class="py-40"></div>

</body>
</html>
