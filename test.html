    <title>Text Fill Effect</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex items-center justify-center h-screen">

    <h1 class="text-5xl font-bold

               hover:bg-[length:100%_100%] cursor-pointer">
