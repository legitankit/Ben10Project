<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixed 900vh Layout</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="text-white overflow-x-hidden h-[900vh] relative">

  <!-- ================= BACKGROUND 1 (0 - 300vh) ================= -->
  <div class="absolute top-0 left-0 w-full h-[300vh]">
    <div class="sticky top-0 h-screen -z-10">
      <div class="absolute inset-0 bg-[url('Image/sketchbg1.jpg')] bg-cover bg-center"></div>
      <div class="absolute inset-0 bg-black/50"></div>
    </div>
  </div>

  <!-- ================= BACKGROUND 2 (300 - 600vh) ================= -->
  <div class="absolute top-[300vh] left-0 w-full h-[300vh]">
    <div class="sticky top-0 h-screen -z-10">
      <div class="absolute inset-0 bg-[url('Image/sketchbg5.jpg')] bg-cover bg-center"></div>
      <div class="absolute inset-0 bg-black/50"></div>
    </div>
  </div>

  <!-- ================= BACKGROUND 3 (600 - 900vh) ================= -->
  <div class="absolute top-[600vh] left-0 w-full h-[300vh]">
    <div class="sticky top-0 h-screen -z-10">
      <div class="absolute inset-0 bg-[url('Image/sketchbg3.jpg')] bg-cover bg-center"></div>
      <div class="absolute inset-0 bg-black/50"></div>
    </div>
  </div>


  <!-- ================= CONTENT ================= -->

  <section class="h-screen flex items-center justify-center text-5xl font-bold">
    Section 1
  </section>

  <section class="h-screen flex items-center justify-center text-5xl font-bold">
    Section 2
  </section>

  <section class="h-screen flex items-center justify-center text-5xl font-bold">
    Section 3
  </section>

  <section class="h-screen flex items-center justify-center text-5xl font-bold">
    Section 4
  </section>

  <section class="h-screen flex items-center justify-center text-5xl font-bold">
    Section 5
  </section>

  <section class="h-screen flex items-center justify-center text-5xl font-bold">
    Section 6
  </section>

  <section class="h-screen flex items-center justify-center text-5xl font-bold">
    Section 7
  </section>

  <section class="h-screen flex items-center justify-center text-5xl font-bold">
    Section 8
  </section>

  <section class="h-screen flex items-center justify-center text-5xl font-bold">
    Section 9
  </section>

</body>
</html>
